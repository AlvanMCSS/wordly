
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>Wordly</h1>
        <p>Your simple English dictionary</p>
        <button id="themeButton" type="button">Change Theme</button>
    </header>

    <main>
        <form id="searchForm">
            <label for="wordInput">Enter a word</label>
            <input
                type="text"
                id="wordInput"
                placeholder="e.g. happy"
                required
            >
            <button type="submit" id="searchButton">Search</button>
        </form>

        <p id="status" role="status"></p>

        <section id="result" aria-live="polite"></section>

        <section>
            <h2>Saved Words</h2>
            <ul id="savedWords"></ul>
        </section>
    </main>

    <footer>
        <p>Wordly Dictionary App</p>
    </footer>
</body>
</html>
